# Netlify configuration — NYC Plan Takeoff Estimator
[build]
  publish = "."
  functions = "netlify/functions"

# Plan-reading calls the Anthropic API, which can take >10s. Raise the function
# timeout so it doesn't get killed mid-request (502). Netlify allows up to 26s
# on the free tier via this setting.
[functions]
  node_bundler = "esbuild"

[functions.analyze]
  timeout = 26

# Image generation (gpt-image-1) can also take well over Netlify's 10s default —
# same reasoning as analyze above.
[functions.render-facade]
  timeout = 26

# Main address is www.restimator.net — the other addresses forward there (one sign-in, one address).
[[redirects]]
  from = "https://cestimator.net/*"
  to = "https://www.restimator.net/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://www.cestimator.net/*"
  to = "https://www.restimator.net/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://restimator.net/*"
  to = "https://www.restimator.net/:splat"
  status = 301
  force = true

# Stable alias so the front-end always has a working path to the function.
[[redirects]]
  from = "/api/analyze"
  to = "/.netlify/functions/analyze"
  status = 200
  force = true

# Sign-in and user admin pages
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/login*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Frame-Options = "DENY"
    Cache-Control = "no-store"

# Saved uploads: chunk writes/reads of ~3.5 MB each
[functions.files]
  timeout = 26
